<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videojuegos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
    
    <header>

        <a href="#" class="logo">
            <img src="logo.png" alt="Logo">
        </a>

        

    </header>
    <div class="rgb-line"></div>


    <!-- MAIN -->
    <main>

        <!-- AGREGAR JUEGO -->
        <section class="add-game">

            <h2>Agregar juego</h2>

            <form>

                <!-- Nombre -->
                <div class="input-group">
                    <label for="name">Nombre del juego</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Ej: Minecraft"
                    >
                </div>


                <!-- Descripción -->
                <div class="input-group">
                    <label for="description">Descripción</label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Descripción del juego"
                    >
                </div>


                <!-- Precio -->
                <div class="input-group">
                    <label for="price">Precio</label>

                    <input
                        type="number"
                        id="price"
                        placeholder="29.99"
                    >
                </div>


                <!-- Imagen -->
                <div class="input-group">
                    <label for="image">Imagen</label>

                    <input
                        type="text"
                        id="image"
                        placeholder="URL de la imagen"
                    >
                </div>


                <!-- Botón -->
                <button type="submit">

                    <span class="material-symbols-outlined">
                        add
                    </span>

                    Agregar juego

                </button>

            </form>

        </section>


    
        <section class="games">

            <h2>Mis juegos</h2>

            <div class="games-container">

                <div class="game-card">
                    <img src="game2.jpg"alt="Imagen del juego">
                    
                    <div class="game-info">
                        <h3>Otro juego</h3>

                        <p>Descripción del juego.</p>
                        <span class="price">$39.99</span>

                        <div class="card-buttons">
                            <button>
                                <span class="material-symbols-outlined">edit</span>
                                Editar
                            </button>

                            <button class="delete">
                                <span class="material-symbols-outlined">
                                    delete
                                </span>
                                Eliminar
                            </button>
                        </div>
                    </div>

                </div>
            
                
                <div class="game-card">
                    <img src="https://imgs.search.brave.com/S_fv37tyh9HXcoI8ckdrIIXDaXmKVBO9FfGK34rb-MI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9hc3Nl/dHMtcHJkLmlnbmlt/Z3MuY29tLzIwMjUv/MDMvMTcvZHlpbmcy/LTE3NDIyNDc4NjU4/MjQuanBnP2Nyb3A9/MToxLHNtYXJ0JmZv/cm1hdD1qcGcmYXV0/bz13ZWJwJnF1YWxp/dHk9ODA"alt="Imagen del juego">
                    
                    <div class="game-info">
                        <h3>Otro juego</h3>

                        <p>Descripción del juego.</p>
                        <span class="price">$39.99</span>

                        <div class="card-buttons">
                            <button>
                                <span class="material-symbols-outlined">edit</span>
                                Editar
                            </button>

                            <button class="delete">
                                <span class="material-symbols-outlined">
                                    delete
                                </span>
                                Eliminar
                            </button>
                        </div>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <div class="rgb-line"></div>
    <footer>

        <img src="logo.png" alt="Logo">

        <p>
            © 2026 GameZone
        </p>

    </footer>




    <script src="script.js"></script>
</body>
</html>
