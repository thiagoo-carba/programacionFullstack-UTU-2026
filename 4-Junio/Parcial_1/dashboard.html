<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>

        <a class="logo" href="dashboard.html" aria-label="Fake Shop">
            <img src="assets/imgs/logo.png" alt="Fake Shop">
        </a>

        <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Buscar productos...">
        </div>

        <section class="header-right">

            <div class="header-item">
                <i class="fa-solid fa-cart-arrow-down"></i>
                <p>(<span class="cart-count">8</span>)</p>
                <span class="saldo">$157.6</span>
            </div>
            
            <div type="button" class="user-btn">
                <i class="fa-solid fa-user"></i>
                <span>Nicolas Perez</span>
            </div>
            
        </section>
        
    </header>

    <main>
        <section class="categorias">
            <h2>Categorias</h2>

            <ul>
                <li><button class="cat-btn1"><i class="fa-solid fa-cart-shopping"></i>All</button></li>
                <li><button class="cat-btn"><i class="fa-solid fa-shirt"></i>Men's clothes</button></li>
                <li><button class="cat-btn"><i class="fa-solid fa-person-dress"></i>Women's clothes</button></li>
                <li><button class="cat-btn"><i class="fa-regular fa-gem"></i>Jewelry</button></li>
                <li><button class="cat-btn"><i class="fa-solid fa-computer"></i>Electronics</button></li>
            </ul>
        </section>


    </main>
</body>
</html>
